# The mod store's index.json (opentennis M116), every 5 minutes (GitHub may run it later). The webhook Space
# (tools/store_index/space) isn't deployed: Docker Spaces need HF PRO. New uploads and pushes onto a PR show in the
# game at once anyway (it reads PRs missing from the index or at another commit); a merge shows after the next run.
# A no-change run is ~4 HF API calls and commits nothing. Secret: HF_TOKEN, a token that can write the dataset.
name: Store index
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/store_index/requirements.txt
      - run: python tools/store_index/build.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
