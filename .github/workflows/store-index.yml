# The mod store's index.json (opentennis M116), hourly: a backstop for webhooks the Space missed (asleep, down).
# The Space (tools/store_index/space) rebuilds it within a minute of any store change. Secret: HF_TOKEN, a token
# that can write the FIZL0/opentennis-mods dataset.
name: Store index
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/store_index/requirements.txt
      - run: python tools/store_index/build.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
